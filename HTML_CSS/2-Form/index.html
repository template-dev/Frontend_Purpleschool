<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Регистрация</title>
</head>
<body>
    <section class="register">
        <h1>Регистрация</h1>
        <section class="login-link">
            <p>Уже есть аккаунт?</p>
            <a href="#">Войти</a>
        </section>
        <p class="company-name">Моя компания</p>
        <form action="" method="POST">
            <input type="text" name="name" placeholder="Имя">
            <input type="text" name="surname" placeholder="Фамилия">
            <input type="email" name="email" placeholder="E-mail">
            <button type="submit">Зарегистрироваться
                <svg width="24" height="23" viewBox="0 0 24 23" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                    d="M23.0607 12.1066C23.6464 11.5208 23.6464 10.5711 23.0607 9.98528L13.5147 0.439342C12.9289 -0.146444 11.9792 -0.146444 11.3934 0.439342C10.8076 1.02513 10.8076 1.97488 11.3934 2.56066L19.8787 11.0459L11.3934 19.5312C10.8076 20.117 10.8076 21.0668 11.3934 21.6525C11.9792 22.2383 12.9289 22.2383 13.5147 21.6525L23.0607 12.1066ZM0 11.0459V12.5459H22V11.0459V9.54594H0V11.0459Z"
                    fill="white" />
                </svg>
            </button>
            <section class="agree-section">
                <input type="checkbox" name="agree" id="agree">
                <label for="agree">Я прочитал и принимаю <a href="#">Условия использования</a></label>
            </section>
        </form>
    </section>
</body>
</html>
